<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>证件译文 Word</title>
    <style>
        :root{color-scheme:dark;--muted:#a4b7cb;--line:#28425d;--accent:#38bdf8}
        *{box-sizing:border-box}body{margin:0;background:#0d2138;color:#e9f2fb;font-family:"Microsoft YaHei",sans-serif}
        .page{max-width:1080px;margin:auto;padding:28px}h1{font-size:28px;margin:0 0 12px}p{line-height:1.8;color:var(--muted)}
        .card{padding:24px;border:1px solid var(--line);border-radius:18px;background:#102940;margin-top:22px}
        .fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}label{display:block;font-size:14px;line-height:1.7}
        input,select,button{font:inherit}select,input[type=file]{display:block;width:100%;margin-top:8px;padding:11px;border:1px solid var(--line);border-radius:10px;background:#0c2034;color:#eef6fc}
        .full{grid-column:1/-1}.check{display:flex;gap:10px;align-items:center}.check input{width:18px;height:18px}
        button{border:0;border-radius:11px;padding:12px 22px;background:var(--accent);color:#06213b;font-weight:700;cursor:pointer}button:disabled{opacity:.5;cursor:wait}
        a{color:#7dd3fc}small{display:block;color:var(--muted);margin-top:8px}progress{width:100%;height:16px;accent-color:var(--accent)}
        .downloads{display:flex;gap:12px;flex-wrap:wrap}.downloads a{padding:10px 14px;border:1px solid var(--line);border-radius:10px;text-decoration:none}
        #message{white-space:pre-wrap;overflow-wrap:anywhere}#warnings{font-size:14px;color:#fbbf24;line-height:1.8}.error{color:#fda4af}
        .embedded-shell .standalone-nav{display:none}[hidden]{display:none!important}@media(max-width:650px){.page{padding:18px}.card{padding:18px}.fields{grid-template-columns:1fr}}
    </style>
</head>
<body>
<main class="page">
    <nav class="standalone-nav"><a href="/certificate-translation?tab=layout-overlay-panel">返回证件翻译工作台</a></nav>
    <section aria-labelledby="title"><h1 id="title">证件译文 Word</h1><p>默认生成清晰可编辑的译文：完整段落自动换行，保留原件照片，印章与签名用文字注明。也可选择保留底纹的原坐标覆盖。结果包含 Word 和质检报告。</p></section>
    <form class="card" id="overlay-form">
        <div class="fields">
            <label class="full">上传 PDF 或图片<input type="file" id="file" name="file" required><small id="limits">正在读取配置…</small></label>
            <label>源语言<select id="source_lang" name="source_lang"></select></label>
            <label>目标语言<select id="target_lang" name="target_lang"></select></label>
            <label class="full">导出排版<select id="output_mode" name="output_mode"></select><small>清晰可编辑排版按证件方向重建段落与字段，适合修改和交付。原坐标覆盖受原文框大小限制，适合需要底纹的场景。</small></label>
            <label>OCR 引擎<select id="ocr_provider" name="ocr_provider"></select><small>负责提取文字与坐标。切换 OCR 不会改变翻译模型、版式分析模型或模型线路。</small></label>
            <label>翻译模型<select id="translation_engine" name="translation_engine"></select></label>
            <label>版式与视觉质检模型<select id="vision_model" name="vision_model"></select><small>用于分析照片、印章保护区；关闭质检仍需进行版式分析。</small></label>
            <label>视觉及 Gemini 模型线路<select id="gemini_route" name="gemini_route"></select><small>Google Vertex 需要服务账号凭据；API 密钥请使用 Google AI Studio 或 OpenRouter。其他翻译模型按各自供应商调用。</small></label>
            <label class="full check"><input type="checkbox" id="enable_qa" checked>启用内容核对与 Word 渲染质检</label>
            <div class="full"><button type="submit" id="submit" disabled>生成译文 Word</button></div>
        </div>
    </form>
    <section class="card" id="task-card" aria-live="polite" hidden>
        <p id="task-number"></p><progress id="progress" max="100" value="0"></progress><p id="message"></p>
        <p id="qa-status"></p><ul id="warnings"></ul><div class="downloads" id="downloads"></div>
        <p><a href="/dashboard" target="_blank" rel="noopener">在任务工作台查看进度与记录</a></p>
    </section>
</main>
<script src="/static/layout_overlay.js"></script>
<script src="/static/embed_shell.js"></script>
</body>
</html>
